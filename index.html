<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Free workout tracker: log your sets, see your progress.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6;--surface:#FFFFFF;--ink:#151A24;--muted:#5E6675;--line:#DCE0E7;--soft:#E7ECF8;
  --accent:#1D4ED8;--accent-ink:#FFFFFF;--red:#C62F2B;--green:#1F8A4C;--yellow:#D39E00;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D121C;--surface:#161D2B;--ink:#E8ECF3;--muted:#9AA3B2;--line:#273043;--soft:#1B2740;
  --accent:#5B8DEF;--accent-ink:#0D121C;--red:#EF5B55;--green:#3FBF7A;--yellow:#F0C040;}}
:root[data-theme="dark"]{
  --bg:#0D121C;--surface:#161D2B;--ink:#E8ECF3;--muted:#9AA3B2;--line:#273043;--soft:#1B2740;
  --accent:#5B8DEF;--accent-ink:#0D121C;--red:#EF5B55;--green:#3FBF7A;--yellow:#F0C040;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:700;letter-spacing:.005em}
h1{font-size:2.2rem;line-height:1;margin:0}
h2{font-size:1.45rem;margin:22px 0 10px;line-height:1.1}
h3{font-size:1.2rem;margin:0}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.sync.on .dot{background:var(--green)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.empty{color:var(--muted);text-align:center;padding:24px 10px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--line)}
.btn.block{display:block;width:100%}
.btn.sm{padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.row-tap:focus-visible,.chip:focus-visible,.tick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--red) 0 25%,var(--accent) 25% 50%,var(--yellow) 50% 75%,var(--green) 75%)}
.hero p{margin:4px 0 14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .n{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:.85rem;color:var(--muted)}

.row-tap{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row-tap .t{font-weight:600}
.row-tap .s{font-size:.85rem;color:var(--muted)}
.list-ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list-ex button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;text-align:left;cursor:pointer;gap:10px}
.list-ex button:last-child{border-bottom:0}
.list-ex .eq{font-size:.82rem;color:var(--muted)}
.list-ex button.sel{background:var(--soft)}
.list-ex button.sel .t::before{content:"✓ ";color:var(--accent);font-weight:700}
.group-h{font-size:.9rem;font-weight:700;color:var(--muted);margin:14px 2px 6px}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* active workout */
.wk-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.wk-name{flex:1;min-width:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.6rem;border:0;background:transparent;padding:2px 0;border-bottom:2px dashed var(--line);border-radius:0}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:1.1rem}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.meta-row select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;margin-bottom:12px}
.ex-card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ex-card .hd h3{color:var(--accent)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:2px 8px;line-height:1}
.set-head,.set-fg{display:grid;grid-template-columns:28px minmax(0,1fr) 62px 62px 34px 38px;gap:6px;align-items:center;text-align:center;font-variant-numeric:tabular-nums}
.set-head{font-size:.78rem;color:var(--muted);font-weight:600;padding:0 2px 4px}
.set-row{position:relative;overflow:hidden;border-radius:10px;margin:3px 0}
.set-del{position:absolute;inset:0;border:0;background:var(--red);color:#fff;font-weight:700;display:flex;justify-content:flex-end;align-items:center;padding-right:20px;cursor:pointer;visibility:hidden}
.set-row.swiping .set-del{visibility:visible}
.set-fg{position:relative;background:var(--surface);padding:4px 2px;border-radius:10px;transition:transform .2s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.set-fg.drag{transition:none}
.set-row.done .set-fg{background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.set-fg .prev{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-fg input{width:100%;text-align:center;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:1rem;user-select:text;-webkit-user-select:text}
.setno{font-weight:700}
.tick{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;color:var(--muted)}
.set-row.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.cam{width:34px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.cam svg{width:19px;height:19px}
.cam.has{color:var(--accent);border-color:var(--accent);background:var(--soft)}
.cam.has::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.cam.old::after{background:var(--muted)}
.clip{background:var(--bg);border-radius:12px;padding:8px;margin:4px 0 8px}
.clip video{display:block;width:100%;max-height:220px;border-radius:9px;background:#000;object-fit:contain}
.clip-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:6px 2px}
.clip-meta b{color:var(--ink)}
.kept{background:var(--yellow);color:#1b1400;font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px}
.clip-btns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.clip-btns>*{grid-column:span 2}.clip-btns>:nth-child(-n+2){grid-column:span 3}
.clip-btns button{border:0;border-radius:9px;background:var(--surface);color:var(--accent);font-weight:700;font-size:.78rem;padding:8px 2px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.clip-btns button.on{background:var(--yellow);color:#1b1400;box-shadow:none}
.clip-btns button.del{color:var(--red)}
.burn-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:14px 0 8px}
.burn-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem;margin:0 0 12px;white-space:pre-wrap}
.share-btns{display:grid;gap:10px}
.tip{font-size:.82rem;color:var(--muted);text-align:center;margin:2px 0 12px}
.addset{margin-top:6px;width:100%;border:0;background:var(--bg);border-radius:10px;padding:9px;font-weight:600;color:var(--muted);cursor:pointer}
.actions{display:grid;gap:10px;margin-top:6px}

/* rest bar */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none}
.rest-in{pointer-events:auto;max-width:536px;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rest-in .time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:58px}
.rest-in .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.rest-in .bar i{display:block;height:100%;background:var(--accent)}
.rest-in button{border:0;border-radius:8px;padding:6px 9px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;cursor:pointer}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:transparent;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:64px;justify-content:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .live{width:6px;height:6px;border-radius:50%;background:var(--red);position:absolute;margin:-10px 0 0 18px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--bg);width:100%;max-width:560px;max-height:90%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-hd h2{margin:0;font-size:1.4rem}
.sheet-scroll{overflow-y:auto;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:10px 16px 14px;border-top:1px solid var(--line)}
.form label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
.form input,.form select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:Barlow,system-ui,sans-serif}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .br{fill:var(--accent)}
.chart .br.now{fill:var(--red)}
.seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:8px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.hbar{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:8px;margin:7px 0;font-size:.9rem}
.hbar .trk{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec{background:var(--bg);border-radius:12px;padding:10px 12px}
.rec .n{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.rec .l{font-size:.8rem;color:var(--muted)}
.sel-ex{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px;font-weight:600}
.hist-sets{font-variant-numeric:tabular-nums;font-size:.92rem;margin:4px 0 12px}
.hist-sets div{padding:2px 0}
.pr{display:inline-block;background:var(--yellow);color:#1b1400;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.setno .prb{display:block;margin:2px auto 0;width:max-content;background:var(--yellow);color:#1b1400;font-size:.6rem;font-weight:700;border-radius:4px;padding:0 4px;line-height:1.4}
.meta-row .right{display:flex;align-items:center;gap:8px}
.snd{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd svg{width:20px;height:20px}
.sheet-hd h2{flex:1;min-width:0}
.sheet-hd .wk-name{width:100%;font-size:1.4rem}
.mode-tag{font-size:.8rem;font-weight:700;color:var(--accent);background:var(--soft);border-radius:8px;padding:4px 8px;white-space:nowrap}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.plan-card .top-r{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plan-card .t{font-weight:700;font-size:1.05rem}
.plan-card .s{font-size:.85rem;color:var(--muted);margin-top:2px}
.plan-card .done-tag{font-size:.75rem;font-weight:700;color:var(--green);white-space:nowrap}
.plan-card .btns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:10px}
.mv{display:flex;gap:4px}.mv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:32px;height:30px;cursor:pointer;color:var(--muted);font-weight:700}
.plan-card .btn:disabled{opacity:.55;cursor:default}
.mv button:disabled{opacity:.35;cursor:default}
.r-head,.r-row{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;text-align:center}
.r-head{font-size:.78rem;color:var(--muted);font-weight:600;padding:0 2px 4px}
.r-row{margin:4px 0}
.r-row input{width:100%;text-align:center;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:1rem}
.prog-row{align-items:flex-start;text-align:left}
.prog-row .s{display:inline-block;margin-top:2px}
.prog-meta{font-size:.78rem;font-weight:600;color:var(--accent)}
.prog-h{font-size:1rem;margin:16px 0 6px}
.prog-rules{margin:0;padding-left:20px;font-size:.92rem;line-height:1.45}
.prog-rules li{margin:3px 0}
.prog-day{padding:6px 12px}
.prog-ex{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.prog-ex:last-child{border-bottom:0}
.prog-ex .muted{white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-tip{background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.9rem;font-weight:600}
.rest-tag{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 6px;vertical-align:middle}
.ex-rest{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:.82rem;color:var(--muted);margin:-2px 0 8px}
.ex-rest select{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.88rem;cursor:pointer;padding:6px 2px}
.paste-link{display:block;margin:10px auto 0;font-size:.85rem}
.ex-note{display:block;width:100%;box-sizing:border-box;resize:none;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:10px;padding:8px 10px;margin:0 0 10px;overflow:hidden}
.ex-note:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ex-note::placeholder{color:var(--muted)}
.note-last{font-size:.82rem;color:var(--muted);margin:-2px 0 6px}
.note-hist{font-size:.88rem;color:var(--muted);font-style:italic;margin:-2px 0 4px;white-space:pre-wrap}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hidden{display:none!important}
.splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;color:#0D121C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);transition:opacity .35s ease,visibility .35s}
.splash.out{opacity:0;visibility:hidden}
.wordmark{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:900;font-size:min(18vw,120px);line-height:1;letter-spacing:.02em;white-space:nowrap}
.wordmark .o-ring{width:.78em;height:.78em;vertical-align:-.03em;margin:0 .02em}
.tagline{font-family:Barlow,system-ui,sans-serif;color:#4A5261;font-weight:600;font-size:min(3.4vw,15px);letter-spacing:.5em;text-transform:uppercase;padding-left:.5em;white-space:nowrap}
.pl{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .splash .pl{animation:plate .45s cubic-bezier(.3,1.5,.5,1) backwards}
  .splash .pl:nth-of-type(3){animation-delay:.2s}.splash .pl:nth-of-type(4){animation-delay:.32s}.splash .pl:nth-of-type(5){animation-delay:.44s}.splash .pl:nth-of-type(6){animation-delay:.56s}
  .splash .wordmark{animation:fadein .4s ease backwards}.splash .tagline{animation:rise .5s ease .7s backwards}
  @keyframes plate{from{transform:scaleY(0)}}
  @keyframes fadein{from{opacity:0;transform:scale(.96)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
}
.brand{display:flex;align-items:center;gap:10px}
.app-icon{width:36px;height:36px;border-radius:9px;background:#FFFFFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}

const e1rm=(w,r)=>(!w||!r)?0:(r===1?w:w*(1+r/30));
const DAY=864e5;
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);const wd=(d.getDay()+6)%7;return d.getTime()-wd*DAY}
function wVolume(w){let v=0;w.exercises.forEach(e=>{const t=exInfo(e.name).type;if(t==='w'||t==='bw')e.sets.forEach(s=>{v+=(num(s.a)||0)*(num(s.b)||0)})});return v}
function fmtVol(v){return v>=10000?f1(v/1000)+' t':Math.round(v).toLocaleString('en-GB')+' kg'}
function fmtDur(ms){const m=Math.round(ms/6e4);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'}
function fmtDate(ts,long){return new Date(ts).toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}
function fmtSet(s,type){const a=num(s.a),b=num(s.b);
  if(type==='cardio')return[a!=null?f1(a)+' km':'',b!=null?f1(b)+' min':''].filter(Boolean).join(' in ')||'–';
  if(type==='time')return(b!=null?b+' sec':'–')+(a?' +'+f1(a)+' kg':'');
  if(type==='bw')return(b!=null?b+' reps':'–')+(a?' +'+f1(a)+' kg':'');
  return(a!=null?f1(a)+' kg':'–')+' × '+(b!=null?b:'–')}
function prevSets(name,excludeId){for(const w of sorted()){if(w.id===excludeId)continue;const e=w.exercises.find(x=>x.name===name);if(e)return e.sets}return null}
function metricsOf(e,type){
  let heavy=0,best=0,vol=0,maxR=0,totR=0,dist=0,time=0,hold=0;
  e.sets.forEach(s=>{const a=num(s.a)||0,b=num(s.b)||0;
    heavy=Math.max(heavy,a);best=Math.max(best,e1rm(a,b));vol+=a*b;maxR=Math.max(maxR,b);totR+=b;dist+=a;time+=b;hold=Math.max(hold,b)});
  return{heavy,best,vol,maxR,totR,dist,time,hold}}

function lineSVG(vals,labels,unit){
  if(vals.length<2)return'<p class="empty small">Log this at least twice to see a graph.</p>';
  const W=320,H=160,L=38,R=10,T=12,B=24,n=vals.length;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad;
  const x=i=>L+i*(W-L-R)/(n-1),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const pts=vals.map((v,i)=>[x(i),y(v)]);const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  let g='';[lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${f1(v)}</text>`});
  const dots=n<=30?pts.map(p=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join(''):'';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart in ${unit}">${g}
  <path class="area" d="${d}L${x(n-1)} ${H-B}L${L} ${H-B}Z"/><path class="ln" d="${d}"/>${dots}
  <text x="${L}" y="${H-6}">${labels[0]}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${labels[n-1]}</text></svg>`}
function barSVG(vals,labels,fmt){
  const W=320,H=150,L=8,R=8,T=16,B=22,n=vals.length,max=Math.max(1,...vals),bw=(W-L-R)/n;
  let s='';vals.forEach((v,i)=>{const h=(v/max)*(H-T-B),xx=L+i*bw+bw*.18,ww=bw*.64;
    s+=`<rect class="br${i===n-1?' now':''}" x="${xx}" y="${H-B-h}" width="${ww}" height="${Math.max(h,v?2:0)}" rx="3"/>`;
    if(v)s+=`<text x="${xx+ww/2}" y="${H-B-h-4}" text-anchor="middle">${fmt?fmt(v):v}</text>`;
    if(i%3===0||i===n-1)s+=`<text x="${xx+ww/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly chart"><line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>${s}</svg>`}

/* ================= Share a plan =================
   The whole plan travels inside the link (after #plan=), so there is no server and nothing to sign up for.
   Target reps, rest timers and plan notes are shared. Your own weights are left out, because they won't suit someone else. */
const b64u={enc:bytes=>{let s='';bytes.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function zip(bytes,dir){const S2=dir==='in'?CompressionStream:DecompressionStream;
  const st=new Blob([bytes]).stream().pipeThrough(new S2('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function encodePlan(routines,title){
  const names=new Set(LIB.map(e=>e.name));const custom=[];
  const r=routines.map(x=>[x.name,x.tip||'',x.exercises.map(e=>{if(!names.has(e.name)){const c=S.custom.find(c=>c.name===e.name);if(c&&!custom.some(k=>k[0]===c.name))custom.push([c.name,c.muscle,c.type])}
    return[e.name,e.rest??null,e.note||'',e.sets.map(s=>s.b??'')]})]);
  const raw=new TextEncoder().encode(JSON.stringify({v:1,t:title,r,c:custom}));
  if(window.CompressionStream){try{return'z'+b64u.enc(await zip(raw,'in'))}catch(_){}}
  return'j'+b64u.enc(raw)}
async function decodePlan(code){
  const kind=code[0],bytes=b64u.dec(code.slice(1));
  const raw=kind==='z'?await zip(bytes,'out'):bytes;
  const d=JSON.parse(new TextDecoder().decode(raw));
  /* Links come from other people, so everything is checked and trimmed before it touches your plan */
  const str=(v,n)=>String(v??'').slice(0,n);
  if(!d||!Array.isArray(d.r)||!d.r.length)throw 0;
  const custom=(Array.isArray(d.c)?d.c:[]).slice(0,40).map(([n,m,t])=>({name:str(n,60).trim(),muscle:[...MUSCLES,'Other'].includes(m)?m:'Other',equip:'Custom',type:FIELDS[t]?t:'w'})).filter(c=>c.name);
  const routines=d.r.slice(0,20).map(([name,tip,ex])=>({name:str(name,60).trim()||'Shared workout',tip:str(tip,200),
    exercises:(Array.isArray(ex)?ex:[]).slice(0,30).map(([n,rest,note,sets])=>{const e={name:str(n,60).trim(),sets:(Array.isArray(sets)?sets:[]).slice(0,30).map(b=>({a:'',b:str(b,8)}))};
      const rs=Number(rest);if(rest!=null&&rest!==''&&rs>=0&&rs<=900)e.rest=Math.round(rs);if(note)e.note=str(note,NOTE_MAX);if(!e.sets.length)e.sets=[{a:'',b:''}];return e}).filter(e=>e.name)})).filter(r=>r.exercises.length);
  if(!routines.length)throw 0;
  return{title:str(d.t,60),routines,custom}}
const planLink=code=>location.origin+location.pathname+'#plan='+code;
async function sharePlan(routines,title){

  ${P.routines.map(r=>`<h3 class="prog-h">${esc(r.name)}</h3>${r.tip?`<p class="muted small" style="margin:0 0 6px">${esc(r.tip)}</p>`:''}<div class="panel prog-day">${r.exercises.map(e=>`<div class="prog-ex"><span>${esc(e.name)}${e.note?`<br><span class="muted small">${esc(e.note)}</span>`:''}</span><span class="muted">${e.sets.length}${e.sets[0].b?'×'+esc(e.sets[0].b):' sets'}${e.rest!=null?` · ${restLabel(e.rest)}`:''}</span></div>`).join('')}</div>`).join('')}`,
  `<div class="btn-grid"><button class="btn" data-close>Not now</button><button class="btn primary" data-sact="planIn">Add to my plan</button></div>`);

function isToday(ts){const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()}
/* Re-open a finished workout: mode 'edit' fixes it up, mode 'resume' carries on training (split sessions) */
function loadWorkout(w,mode){if(!w)return;
  if(S.active){toast('Finish or discard your current workout first.');return}
  S.active={id:w.id,name:w.name,routine:w.routine,start:Date.now(),updated:Date.now(),mode,orig:{start:w.start,end:w.end},
    exercises:w.exercises.map(e=>({name:e.name,...(e.note?{note:e.note}:{}),sets:e.sets.map(x=>({a:x.a??'',b:x.b??'',done:true}))}))};
  tab='workout';saveProfile(true);closeSheet();render();window.scrollTo(0,0);

function startWorkout(from,rid){
  const h=new Date().getHours();
  S.active={id:uid(),name:from?from.name:(h<12?'Morning workout':h<17?'Afternoon workout':'Evening workout'),start:Date.now(),updated:Date.now(),
    exercises:from?from.exercises.map(e=>({name:e.name,...(e.rest!=null?{rest:e.rest}:{}),...(e.note?{note:e.note}:{}),sets:e.sets.map(s=>({a:s.a??'',b:s.b??'',done:false}))})):[]};
  if(rid)S.active.routine=rid;
  if(from&&from.tip)S.active.tip=from.tip;
  saveProfile(true);render();window.scrollTo(0,0);
  if(!from)openPicker();
}

function touch(){S.active.updated=Date.now();saveProfile()}
/* ================= Exercise notes ================= */
const NOTE_MAX=500;
function noteBox(v,attr,ph){v=v||'';const rows=Math.min(6,Math.max(1,v.split('\n').length,Math.ceil(v.length/38)));
  return`<textarea class="ex-note" ${attr} rows="${rows}" maxlength="${NOTE_MAX}" placeholder="${esc(ph)}" aria-label="Exercise notes">${esc(v)}</textarea>`}
function growNote(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
/* The most recent note you left on this exercise in a finished workout */
function lastNote(name,skipId){for(const w of sorted()){if(w.id===skipId)continue;const e=w.exercises.find(x=>x.name===name&&x.note);if(e)return e.note}return''}
/* Set PRs: beats your heaviest weight, or best single-set volume (kg x reps), from past workouts and earlier sets today */
function histBest(name){let heavy=0,vol=0,any=false;
  S.workouts.forEach(w=>{if(S.active&&w.id===S.active.id)return;w.exercises.forEach(e=>{if(e.name!==name)return;any=true;e.sets.forEach(s=>{const a=num(s.a)||0,b=num(s.b)||0;heavy=Math.max(heavy,a);vol=Math.max(vol,a*b)})})});
  return any?{heavy,vol}:null}
function setPR(ex,j,best){
  if(!best||exInfo(ex.name).type!=='w')return null;
  let heavy=best.heavy,vol=best.vol;
  ex.sets.forEach((s,k)=>{if(k<j&&s.done){const a=num(s.a)||0,b=num(s.b)||0;heavy=Math.max(heavy,a);vol=Math.max(vol,a*b)}});
  const s=ex.sets[j],a=num(s.a)||0,b=num(s.b)||0;
  if(a>0&&a>heavy)return{kind:'weight',text:f1(a)+' kg heaviest ever'};
  if(a*b>0&&a*b>vol)return{kind:'volume',text:f1(a*b)+' kg best set volume'};
  return null}
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
let actx=null;
function beep(notes){if(!S.sound)return;try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  let t=actx.currentTime+0.01;
  notes.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+0.02);t+=d*0.8})}catch(e){}}
const tickSound=()=>beep([[880,0.12]]);
const prSound=()=>beep([[784,0.12],[988,0.12],[1319,0.3]]);

});

function restOpts(cur){const list=[0,15,30,40,45,60,90,120,150,180,240];if(cur!=null&&!list.includes(cur))list.push(cur);list.sort((a,b)=>a-b);
  return`<option value="" ${cur==null?'selected':''}>Default</option>`+list.map(s=>`<option value="${s}" ${s===cur?'selected':''}>${s?(s>=60?(s%60?(s/60).toFixed(1):s/60)+' min':s+'s'):'None'}</option>`).join('')}
/* Tap a weight or reps box and its number is highlighted, so typing replaces it.
   iOS clears a selection made on focus, so it is re-applied just after the tap finishes. */
document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName!=='INPUT'||t.getAttribute('inputmode')!=='decimal')return;
  const v0=t.value,sel=()=>{if(document.activeElement!==t||t.value!==v0)return;try{t.setSelectionRange(0,t.value.length)}catch(_){t.select()}};
  sel();setTimeout(sel,0);setTimeout(sel,120)});

    else s.done=false;

  if(act==='sound'){S.sound=!S.sound;saveProfile();render();if(S.sound)tickSound();toast(S.sound?'Tick sounds on':'Tick sounds off')}

  if(act==='rStart'){const r=S.routines.find(x=>x.id===b.dataset.id);if(r){startWorkout(r,r.id);toast(r.name+' started')}}
  if(act==='rUp'||act==='rDown'){const k=+b.dataset.k,n=act==='rUp'?k-1:k+1,R=S.routines;if(n<0||n>=R.length)return;[R[k],R[n]]=[R[n],R[k]];saveProfile(true);render()}
  if(act==='rAddSet'){const sets=editR.exercises[i].sets,last=sets[sets.length-1];sets.push({a:last?last.a:'',b:last?last.b:''});render()}
  if(act==='rDelSet'){editR.exercises[i].sets.splice(j,1);render()}
  if(act==='rRmEx'){editR.exercises.splice(i,1);render()}
  if(act==='rSave'){const n=editR.name.trim();if(!n){toast('Give this workout a name first.');const el=$('rName');if(el)el.focus();return}
    const r={id:editR.id,name:n,...(editR.from?{from:editR.from}:{}),...(editR.prog?{prog:editR.prog,tip:editR.tip}:{}),exercises:editR.exercises.map(e=>({name:e.name,...(e.rest!=null?{rest:e.rest}:{}),...(e.note&&e.note.trim()?{note:e.note.trim()}:{}),sets:e.sets.map(x=>({a:x.a,b:x.b}))}))};
    const k=S.routines.findIndex(x=>x.id===r.id);if(k>-1)S.routines[k]=r;else S.routines.push(r);

  if(act==='cont')loadWorkout(S.workouts.find(w=>w.id===b.dataset.id),'resume');
  if(act==='discard'&&S.active.mode){askConfirm(S.active.mode==='edit'?'Cancel editing?':'Stop continuing?','Nothing you changed now will be saved. The workout stays in your history as it was.','Cancel changes',()=>{S.active=null;stopRest();saveProfile(true);closeSheet();render();toast('No changes made')});return}
  if(act==='discard')askConfirm('Discard workout?','Nothing from this workout will be saved.','Discard workout',()=>{S.active=null;stopRest();saveProfile(true);closeSheet();render();toast('Workout discarded')});
  if(act==='hist')openWorkout(b.dataset.id);
  if(act==='exInfo')openExercise(b.dataset.name);

  if(act==='toggle'){const k=ck(b.dataset.ex,+b.dataset.j);openClips.has(k)?openClips.delete(k):openClips.add(k);render();return}
  if(act==='fs'){const vid=b.closest('.clip').querySelector('video');if(!vid)return;
    try{if(vid.webkitEnterFullscreen&&!vid.requestFullscreen)vid.webkitEnterFullscreen();else if(vid.requestFullscreen)vid.requestFullscreen().catch(()=>vid.webkitEnterFullscreen&&vid.webkitEnterFullscreen());else vid.webkitEnterFullscreen()}catch(_){}
    vid.play().catch(()=>{});return}
  if(act==='keep'&&r){r.keep=!r.keep;VDB.put(r).then(refreshClips,()=>toast('Could not update that video'));toast(r.keep?'Kept. Recording this set again will not replace it.':'No longer kept');return}
  if(act==='del'&&r){const back=sheetEx&&!$('sheet').classList.contains('hidden')?sheetEx:null;
    askConfirm('Delete video?','This video will be removed from your phone.','Delete video',()=>{VDB.del(r.key).then(()=>{delete clips[r.key];dropURL(r.key);openClips.delete(r.key);closeSheet();render();if(back)openExercise(back);toast('Video deleted')},()=>toast('Could not delete that video'))},back?()=>openExercise(back):null);return}
  if(act==='share'&&r){openShare(r);return}
  if(act==='raw'&&r){shareFile(r.blob,`lift-log-${slug(r.ex)}.${extOf(r.type)}`);return}
  if(act==='copy'&&r){copyCap(caption(r));return}
  if(act==='burn'&&r){burnClip(r);return}
  if(act==='burnStop'){if(burnCancel)burnCancel();return}
  if(act==='shareOut'&&burnOut){shareFile(burnOut.blob,burnOut.name);return}
  if(act==='copyOut'&&burnOut){copyCap(burnOut.cap);return}
});

/* ================= Finish & PRs ================= */
function finishWorkout(){
  const a=S.active;
  snapClips(a);
  const exercises=a.exercises.map(e=>({name:e.name,...(e.note&&e.note.trim()?{note:e.note.trim()}:{}),sets:e.sets.filter(s=>s.done).map(s=>({a:s.a===''?null:num(s.a),b:s.b===''?null:num(s.b)}))})).filter(e=>e.sets.length);
  if(!exercises.length){toast(a.mode?'Tick at least one set, or delete the workout from History.':'Tick at least one set as done before finishing.');return}
  const w={id:a.id,name:a.name.trim()||'Workout',start:a.start,end:Date.now(),exercises};if(a.routine)w.routine=a.routine;
  if(a.mode){w.start=a.orig.start;w.end=a.mode==='edit'?a.orig.end:a.orig.end+(Date.now()-a.start)}
  const prs=[];
  exercises.forEach(e=>{const type=exInfo(e.name).type,m=metricsOf(e,type),hist=series(e.name,a.id);if(!hist.length)return;
    METRICS[type].forEach(([label,key,unit])=>{if(key==='vol'||key==='totR'||key==='time')return;const prev=Math.max(...hist.map(h=>h.m[key]));
      if(m[key]>prev&&m[key]>0)prs.push(`${e.name}: ${label} ${f1(m[key])} ${unit}`)})});
  S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(w);S.active=null;stopRest();saveWorkout(w);saveProfile(true);
  if(a.mode==='edit'){tab='history';render();window.scrollTo(0,0);toast('Changes saved');openWorkout(w.id);return}
  render();
  const sets=exercises.reduce((n,e)=>n+e.sets.length,0);
  openSheet('Workout saved',`<div class="tiles"><div class="tile"><div class="n">${fmtDur(w.end-w.start)}</div><div class="l">Duration</div></div>
  <div class="tile"><div class="n">${fmtVol(wVolume(w))}</div><div class="l">Volume</div></div>
  <div class="tile"><div class="n">${exercises.length}</div><div class="l">Exercises</div></div><div class="tile"><div class="n">${sets}</div><div class="l">Sets</div></div></div>
  ${prs.length?`<h2>New personal records</h2><div class="panel">${prs.map(p=>`<div style="padding:4px 0">${esc(p)}<span class="pr">PR</span></div>`).join('')}</div>`:'<p class="muted" style="margin-top:14px">Saved to your history. Check the Progress tab to see how you are trending.</p>'}`,
  `<button class="btn primary block" data-close>Done</button>`);
}

/* ================= Rest timer ================= */
let restEnd=0,restLen=0;
/* A program exercise can carry its own timer (e.g. 40s on a 7-set finisher). Rest set to Off turns every timer off. */
function startRest(sec){if(!S.rest)return;if(sec==null)sec=S.rest;if(!sec){stopRest();return}restLen=sec*1000;restEnd=Date.now()+restLen;$('rest').classList.remove('hidden');tickClock()}
function stopRest(){restEnd=0;$('rest').classList.add('hidden')}
$('rest').addEventListener('click',e=>{const v=e.target.dataset.rest;if(!v)return;if(v==='skip')return stopRest();restEnd+=+v*1000;restLen=Math.max(restLen,restEnd-Date.now());tickClock()});
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tickClock(){
  const c=$('clock');if(c&&S.active){const s=Math.floor((Date.now()-S.active.start+(S.active.mode==='resume'?S.active.orig.end-S.active.orig.start:0))/1000);c.textContent=s>=3600?Math.floor(s/3600)+':'+mmss(s%3600).padStart(5,'0'):mmss(s)}
  if(restEnd){const left=Math.ceil((restEnd-Date.now())/1000);
    if(left<=0){stopRest();toast('Rest over. Next set.');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    else{$('restTime').textContent=mmss(left);$('restBar').style.width=Math.max(0,Math.min(100,(restEnd-Date.now())/restLen*100))+'%'}}
}
setInterval(tickClock,1000);

/* ================= History ================= */
function viewHistory(){
  const ws=sorted();if(!ws.length)return'<p class="empty">No workouts yet. Finish your first workout and it will appear here.</p>';
  let out='',cur='';
  ws.forEach(w=>{const m=new Date(w.start).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    if(m!==cur){cur=m;out+=`<h2>${m}</h2>`}
    out+=`<button class="row-tap" data-act="hist" data-id="${w.id}"><span style="min-width:0"><span class="t">${esc(w.name)}</span><br><span class="s">${fmtDate(w.start)}, ${fmtDur(w.end-w.start)}, ${fmtVol(wVolume(w))}</span><br>
    <span class="s">${w.exercises.slice(0,3).map(e=>e.sets.length+' × '+esc(e.name)).join('<br>')}${w.exercises.length>3?`<br>and ${w.exercises.length-3} more`:''}</span></span><span class="muted">›</span></button>`});
  return out}
function openWorkout(id){const w=S.workouts.find(x=>x.id===id);if(!w)return;
  openSheet(`<input class="wk-name" id="histName" data-id="${w.id}" value="${esc(w.name)}" maxlength="60" aria-label="Workout name" enterkeyhint="done">`,`<p class="muted small" style="margin:0 0 8px">Tap the name to rename this workout.</p><p class="muted" style="margin-top:0">${fmtDate(w.start,true)}<br>${fmtDur(w.end-w.start)}, ${fmtVol(wVolume(w))} volume</p>
  ${w.exercises.map(e=>{const t=exInfo(e.name).type;return`<h3>${esc(e.name)}</h3>${e.note?`<p class="note-hist">${esc(e.note)}</p>`:''}<div class="hist-sets">${e.sets.map((s,j)=>`<div>${j+1}. ${esc(fmtSet(s,t))}</div>`).join('')}</div>`}).join('')}`,
  `<div class="btn-grid">${isToday(w.start)?`<button class="btn primary" data-sact="cont" data-id="${w.id}" style="grid-column:1/-1">Continue this workout</button>`:''}<button class="btn" data-sact="edit" data-id="${w.id}">Edit</button><button class="btn" data-sact="again" data-id="${w.id}">Do again</button><button class="btn" data-sact="toPlan" data-id="${w.id}">Add to my plan</button><button class="btn danger" data-sact="del" data-id="${w.id}">Delete</button></div>`)}

/* ================= Progress ================= */
function viewProgress(){
  if(!S.workouts.length)return'<p class="empty">Your stats and graphs appear here once you have finished a workout. Everything is free, no upgrades.</p>';
  const now=Date.now(),wk0=weekStart(now);
  const weeks=[...Array(12)].map((_,k)=>wk0-(11-k)*7*DAY);
  const perWeek=weeks.map(s=>S.workouts.filter(w=>w.start>=s&&w.start<s+7*DAY));
  const counts=perWeek.map(a=>a.length),vols=perWeek.map(a=>a.reduce((v,w)=>v+wVolume(w),0));
  let streak=0;for(let k=11;k>=0;k--){if(counts[k])streak++;else if(k===11)continue;else break}
  const last30=S.workouts.filter(w=>w.start>now-30*DAY);
  const avgDur=S.workouts.reduce((t,w)=>t+(w.end-w.start),0)/S.workouts.length;
  const mus={};last30.forEach(w=>w.exercises.forEach(e=>{const m=exInfo(e.name).muscle;mus[m]=(mus[m]||0)+e.sets.length}));
  const musArr=Object.entries(mus).sort((a,b)=>b[1]-a[1]),musMax=musArr.length?musArr[0][1]:1;
  const counted=exCounts(),names=Object.keys(counted).sort((a,b)=>counted[b]-counted[a]);
  if(!progEx||!counted[progEx])progEx=names[0];
  const wkLbl=weeks.map(s=>shortDate(s));
  return`<div class="tiles"><div class="tile"><div class="n">${S.workouts.length}</div><div class="l">Workouts logged</div></div>
  <div class="tile"><div class="n">${counts[11]}</div><div class="l">This week</div></div>
  <div class="tile"><div class="n">${streak}</div><div class="l">Week streak</div></div>
  <div class="tile"><div class="n">${fmtDur(avgDur)}</div><div class="l">Average workout</div></div></div>
  <h2>Exercise progress</h2><div class="panel">
  <select class="sel-ex" id="progSel" aria-label="Choose exercise">${names.map(n=>`<option ${n===progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>
  ${exerciseBlock(progEx)}</div>
  <h2>Workouts per week</h2><div class="panel">${barSVG(counts,wkLbl)}</div>
  <h2>Volume per week</h2><div class="panel">${barSVG(vols,wkLbl,v=>v>=1000?f1(v/1000)+'t':Math.round(v))}<p class="muted small" style="margin:6px 0 0">Weight × reps across every set. Last 30 days: ${fmtVol(last30.reduce((v,w)=>v+wVolume(w),0))}.</p></div>
  <h2>Sets by muscle, last 30 days</h2><div class="panel">${musArr.length?musArr.map(([m,n])=>`<div class="hbar"><span>${esc(m)}</span><span class="trk"><i style="width:${n/musMax*100}%"></i></span><b>${n}</b></div>`).join(''):'<p class="empty small">No sets in the last 30 days.</p>'}</div>`}
function exerciseBlock(name){
  const type=exInfo(name).type,ser=series(name),mets=METRICS[type],k=Math.min(progMetric,mets.length-1),[label,key,unit]=mets[k];
  const vals=ser.map(s=>Math.round(s.m[key]*10)/10),labels=ser.map(s=>shortDate(s.date));
  const recs=type==='w'?[['Heaviest weight',Math.max(...ser.map(s=>s.m.heavy)),'kg'],['Best est. 1RM',Math.max(...ser.map(s=>s.m.best)),'kg'],['Most reps in a set',Math.max(...ser.map(s=>s.m.maxR)),''],['Best session volume',Math.max(...ser.map(s=>s.m.vol)),'kg']]
    :type==='bw'?[['Most reps in a set',Math.max(...ser.map(s=>s.m.maxR)),''],['Best session reps',Math.max(...ser.map(s=>s.m.totR)),''],['Most added weight',Math.max(...ser.map(s=>s.m.heavy)),'kg'],['Times done',ser.length,'']]
    :type==='cardio'?[['Longest distance',Math.max(...ser.map(s=>s.m.dist)),'km'],['Longest session',Math.max(...ser.map(s=>s.m.time)),'min'],['Total distance',ser.reduce((t,s)=>t+s.m.dist,0),'km'],['Times done',ser.length,'']]
    :[['Longest hold',Math.max(...ser.map(s=>s.m.hold)),'sec'],['Times done',ser.length,'']];
  return`${mets.length>1?`<div class="seg">${mets.map((m,i)=>`<button data-act="metric" data-k="${i}" aria-pressed="${i===k}">${m[0]}</button>`).join('')}</div>`:''}
  ${lineSVG(vals,labels,unit)}
  <div class="recs" style="margin-top:10px">${recs.map(([l,v,u])=>`<div class="rec"><div class="n">${f1(v)}${u?' '+u:''}</div><div class="l">${l}</div></div>`).join('')}</div>
  ${type==='w'?'<p class="muted small" style="margin:8px 0 0">Est. 1RM is the most you could likely lift once, worked out from your best set.</p>':''}`}

/* ================= Exercises ================= */
function viewExercises(){
  return`<input class="search" id="exSearch" placeholder="Search ${allEx().length} exercises" value="${esc(exSearch)}" autocomplete="off">
  <div class="chips">${chipsHTML(exFilter,'m').replace(/data-m=/g,'data-act="filter" data-m=')}</div>
  <div id="exList">${exListHTML()}</div>
  <div id="exNew">${newExBtn(exSearch,exFilter,'data-act="addCustom"')}</div>`}
function exListHTML(){const c=exCounts();return groupedHTML(filterEx(exFilter,exSearch),exFilter,e=>`<button data-act="exInfo" data-name="${esc(e.name)}"><span class="t">${esc(e.name)}</span><span class="eq">${c[e.name]?c[e.name]+'× logged':esc(e.equip)}</span></button>`)}
function openExercise(name){const info=exInfo(name),ser=series(name);progMetric=0;
  const recent=ser.slice(-5).reverse();
  openSheet(esc(name),`<p class="muted" style="margin-top:0">${esc(info.muscle)}, ${esc(info.equip)}</p>
  ${exVideosHTML(name)}
  ${ser.length?exerciseBlock(name)+`<h2>Recent sessions</h2>${recent.map(s=>`<div class="panel"><b>${fmtDate(s.date)}</b><div class="hist-sets" style="margin-bottom:0">${s.sets.map((x,j)=>`<div>${j+1}. ${esc(fmtSet(x,info.type))}</div>`).join('')}</div></div>`).join('')}`
  :'<p class="empty">You have not logged this exercise yet. Add it to a workout and your history and graph will show here.</p>'}`,
  (info.equip==='Custom'?`<button class="btn danger block" style="margin-bottom:${ser.length?'10px':'0'}" data-sact="delCustom" data-name="${esc(name)}">Delete this exercise</button>`:'')+
  (ser.length?`<button class="btn primary block" data-sact="progress" data-name="${esc(name)}">Open in Progress</button>`:''));sheetEx=name}
let customCtx={};
function openCustom(ctx){
  customCtx=ctx||{};const m=MUSCLES.includes(customCtx.muscle)||customCtx.muscle==='Other'?customCtx.muscle:'Chest';
  const guess=m==='Cardio'?'cardio':'w';
  openSheet('New exercise',`<div class="form"><label for="cName">Name</label><input id="cName" placeholder="For example, Cable Y-Raise" maxlength="60" value="${esc(customCtx.name||'')}">
  <label for="cMus">Body part</label><select id="cMus">${[...MUSCLES,'Other'].map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select>
  <label for="cType">What you record</label><select id="cType">${[['w','Weight and reps'],['bw','Reps (bodyweight)'],['time','Time held'],['cardio','Distance and time']].map(([v,t])=>`<option value="${v}" ${v===guess?'selected':''}>${t}</option>`).join('')}</select></div>`,
  customCtx.fromPicker?`<div style="display:grid;grid-template-columns:1fr 2fr;gap:10px"><button class="btn" data-sact="backPick">Back</button><button class="btn primary" data-sact="saveCustom">Save and select</button></div>`
  :`<button class="btn primary block" data-sact="saveCustom">Save exercise</button>`);
  if(!customCtx.name)setTimeout(()=>{const i=$('cName');if(i)i.focus()},250)}
function saveCustom(){const n=$('cName').value.trim().replace(/\s+/g,' ');if(!n){toast('Give the exercise a name.');return}
  const clash=allEx().find(e=>e.name.toLowerCase()===n.toLowerCase());
  if(clash){toast(clash.name+' is already in the list.');return}
  const muscle=$('cMus').value;S.custom.push({name:n,muscle,equip:'Custom',type:$('cType').value});saveProfile(true);
  if(customCtx.fromPicker){if(!pickSel.includes(n))pickSel.push(n);pickFilter=muscle;pickSearch='';openPicker(true);toast(n+' added and selected')}
  else{closeSheet();render();toast(n+' added')}}

/* ================= Boot ================= */
loadLocal();
if(S.active)tab='workout';
(function(){const sp=$('splash');const hide=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),400)};
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(hide,reduce?700:1700);sp.addEventListener('click',hide)})();
render();
loadClips();
connect();
setTimeout(checkHash,1800);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
